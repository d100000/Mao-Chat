name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/bootstrap_library.py
      - run: python -m unittest discover -q
      - run: python -m compileall -q agent scripts tests
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          E2E_BROWSER_CHANNEL: bundled
      - run: npm run test:ui:plan
        env:
          E2E_BROWSER_CHANNEL: bundled
      - run: npm run test:ui:legacy
        env:
          E2E_BROWSER_CHANNEL: bundled
      - run: python scripts/check_release.py
